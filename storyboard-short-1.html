<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0d0d0d; font-family: 'Impact', 'Arial Black', sans-serif; }
.short { width: 1080px; height: 1920px; background: linear-gradient(180deg, #0a0a0a 0%, #1a0a0a 40%, #0d0d0d 100%); position: relative; overflow: hidden; }
.vignette { position: absolute; width: 100%; height: 100%; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%); }
.spark-overlay { position: absolute; width: 100%; height: 100%; background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="20" cy="30" r="1.5" fill="%23ff6600"/><circle cx="70" cy="60" r="1" fill="%23ffcc00"/><circle cx="40" cy="80" r="2" fill="%23ff3333"/><circle cx="80" cy="20" r="1.2" fill="%23ff9900"/></svg>'); opacity: 0.6; }
.character-zone { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 900px; height: 1400px; background: radial-gradient(ellipse at center bottom, rgba(255,50,50,0.2) 0%, transparent 60%); }
.text-top { position: absolute; top: 120px; left: 0; right: 0; text-align: center; padding: 0 60px; }
.text-top-line { font-size: 80px; color: #ff3333; text-transform: uppercase; letter-spacing: 8px; text-shadow: 0 0 30px rgba(255,50,50,0.8), 4px 4px 0 #000; line-height: 1.1; }
.quote-box { position: absolute; top: 480px; left: 50%; transform: translateX(-50%); width: 860px; background: rgba(0,0,0,0.75); border-left: 8px solid #ff3333; padding: 40px 50px; border-radius: 0 16px 16px 0; }
.quote-text { font-size: 56px; color: #ffffff; text-transform: uppercase; letter-spacing: 4px; text-shadow: 3px 3px 0 #000; line-height: 1.3; text-align: center; }
.cta-bottom { position: absolute; bottom: 140px; left: 0; right: 0; text-align: center; }
.cta-text { font-size: 64px; color: #ffcc00; text-transform: uppercase; letter-spacing: 6px; text-shadow: 0 0 20px rgba(255,204,0,0.6), 4px 4px 0 #000; }
.fire-bar { position: absolute; bottom: 60px; left: 10%; right: 10%; height: 6px; background: linear-gradient(90deg, transparent, #ff6600, #ffcc00, #ff6600, transparent); border-radius: 3px; }
.aura { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,50,50,0.1) 0%, transparent 70%); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.1); } }
</style>
</head>
<body>
<div class="short">
  <div class="aura"></div>
  <div class="vignette"></div>
  <div class="spark-overlay"></div>
  <div class="character-zone"></div>
  <div class="text-top">
    <div class="text-top-line">Gym Motivation</div>
  </div>
  <div class="quote-box">
    <div class="quote-text">"Weakness is a choice.<br>Pick up the iron<br>and prove them<br>wrong."</div>
  </div>
  <div class="cta-bottom">
    <div class="cta-text">Subscribe 🔥</div>
  </div>
  <div class="fire-bar"></div>
</div>
</body>
</html>
